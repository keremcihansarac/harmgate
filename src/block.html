<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by Harmgate</title>
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <link rel="stylesheet" href="./lib/shared.css" />
  </head>
  <body>
    <main id="content" hidden>
      <h1>This page is blocked</h1>
      <p id="reason" class="muted">Harmgate blocked this site.</p>
      <p><code id="host"></code></p>
      <div class="actions">
        <button id="back" class="primary" type="button">Go back</button>
      </div>
      <section id="wrong" hidden>
        <h2>Blocked by mistake?</h2>
        <p class="small muted">Report it so the list gets fixed for everyone.</p>
        <div class="actions">
          <a id="report" class="button" target="_blank" rel="noopener noreferrer">Report on GitHub</a>
        </div>
        <p class="small muted" style="margin-top: 12px">A report is a public GitHub issue, and it shows this site's name next to your GitHub account. Nothing is sent unless you submit it.</p>
      </section>
    </main>
    <script type="module" src="./block.ts"></script>
  </body>
</html>
